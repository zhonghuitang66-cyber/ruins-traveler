<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋烬遗境 · 九技能特效评审</title><style>body{margin:0;background:#d7bf86;color:#fff5d8;font:14px 'Microsoft YaHei',sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.panel{position:fixed;left:16px;top:16px;max-width:310px;padding:16px;border:1px solid #d5bd7b;background:#263b2eea;border-radius:7px}button,select{background:#405743;color:#fff1ca;border:1px solid #b5ad7b;padding:8px;margin:4px 0;font:inherit}h1{font-size:18px;margin:0 0 12px}p{font-size:11px;line-height:1.6}#stats{white-space:pre-line;font-size:11px;color:#e8d5a0}.bottom{position:fixed;bottom:12px;left:16px;right:16px;font-size:11px;text-align:center;background:#263b2edd;padding:8px}a{color:#efd29c}</style><canvas id="scene"></canvas><div class="panel"><h1>九技能 · 特效与免费音效</h1><select id="skill"><option value="swordsman:0">剑士 · 爆裂斩击</option><option value="swordsman:1">剑士 · 勇猛突刺</option><option value="swordsman:2">剑士 · 跳跃猛击</option><option value="paladin:0">圣骑士 · 圣光护罩</option><option value="paladin:1">圣骑士 · 雷霆制裁（三击）</option><option value="paladin:2">圣骑士 · 回光返照</option><option value="archer:0">弓箭手 · 惩戒射击</option><option value="archer:1">弓箭手 · 冰霜箭矢</option><option value="archer:2">弓箭手 · 风魔乱舞</option></select><br><button id="play">播放技能</button> <button id="pause">暂停</button> <button id="step">单步0.1秒</button><p>真实Game技能事件驱动。同一套特效已接主游戏；此页只隔离观察，不是最终角色或整局验收。</p><label>特效预算 <select id="quality"><option value="detail">精细</option><option value="standard">均衡</option><option value="economy">省电</option></select></label><br><label><input id="weak" type="checkbox"> 弱化闪光</label><br><label><input id="sound" type="checkbox" checked> 免费网络音效</label><p>全部 Kenney CC0，非生成音效。首次播放需点击解锁。</p><div id="stats"></div><p><a href="index.html">返回游戏</a> · <a href="character-preview.html">角色动作</a></p></div><div class="bottom">亮核 / 主形状 / 破碎尾迹 · 最高192粒子、24瞬时形状，画质档位可降低预算 · 暂停冻结 · 无全屏Bloom</div><script type="module">
import * as T from './vendor/three.module.js';import {Game} from './src/core.js';import {CLASSES} from './src/data.js';import {createSkillVFX} from './src/skill-vfx.js';import {createAudioManager} from './src/audio.js';
const $=id=>document.getElementById(id),renderer=new T.WebGLRenderer({canvas:$('scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.outputColorSpace=T.SRGBColorSpace;const scene=new T.Scene();scene.background=new T.Color(0xd7bf86);const camera=new T.PerspectiveCamera(42,1,.1,100);camera.position.set(10,12,17);camera.lookAt(0,.6,0);scene.add(new T.HemisphereLight(0xffedc5,0x66745b,2.5));const light=new T.DirectionalLight(0xffe5bd,3);light.position.set(-3,10,4);scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(45,45),new T.MeshStandardMaterial({color:0xbba46c,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new T.GridHelper(40,20,0x9b875b,0xb5a06c));const hero=new T.Group(),cloth=new T.MeshStandardMaterial({color:0xd38b38,flatShading:true});const body=new T.Mesh(new T.CylinderGeometry(.35,.45,1,6),cloth);body.position.y=1;hero.add(body);const head=new T.Mesh(new T.IcosahedronGeometry(.33,0),new T.MeshStandardMaterial({color:0xe2bd8e,flatShading:true}));head.position.y=1.75;hero.add(head);scene.add(hero);const vfx=createSkillVFX(scene),audio=createAudioManager();let paused=false,jump=0,nextBasic=Infinity,basicLeft=0,last=performance.now();
const soundKeys={swordsman:['','dash','land'],paladin:['guard','thunder','heal'],archer:['arrow_volley','frost_arrow','wind_arrow']};
const world=new Game((type,d)=>{vfx.emit(type,d);if(type==='skill'&&soundKeys[d.role]?.[d.index])void audio.play(soundKeys[d.role][d.index]);if(type==='skill-impact')void audio.play(d.index===0?'sword_slash':'land');if(type==='thunder-mark')void audio.play('thunder');if(type==='wind-volley')void audio.play('wind_arrow');if(type==='swing'&&world.kind==='archer')void audio.play('archer_attack');if(type==='number'&&d.type==='heal')vfx.emit('heal',d);if(type==='jump')jump=.45});world.world.walls=[];world.world.spawns=[];
const shotGeo=new T.ConeGeometry(.09,.6,4),shotMaterials=[new T.MeshBasicMaterial({color:0xffd484}),new T.MeshBasicMaterial({color:0xa4eaff}),new T.MeshBasicMaterial({color:0xa3ebca})],shots=[],up=new T.Vector3(0,1,0),dir=new T.Vector3();
$('play').onclick=async()=>{paused=false;audio.setPaused(false);audio.stop();audio.setMuted(!$('sound').checked);await audio.unlock();vfx.reset();const [role,index]=$('skill').value.split(':');world.start(role);world.enemies=[];Object.assign(world.player,{x:0,z:4,hp:CLASSES[role].hp*.6});world.aim={x:0,z:-1};cloth.color.setHex(CLASSES[role].color);world.skill(Number(index),{x:0,z:-1});basicLeft=role==='paladin'&&index==='1'?3:role==='archer'&&index==='1'?1:0;nextBasic=world.time+.3;$('pause').textContent='暂停'};
$('pause').onclick=()=>{paused=!paused;audio.setPaused(paused);$('pause').textContent=paused?'继续':'暂停'};$('sound').onchange=()=>audio.setMuted(!$('sound').checked);$('quality').onchange=()=>vfx.configure({quality:$('quality').value});$('weak').onchange=()=>vfx.configure({reducedFlash:$('weak').checked});
function advance(dt){if(world.running){world.update(dt);if(basicLeft&&world.time>=nextBasic){if(world.attack(true)){basicLeft--;nextBasic=world.time+.82}}jump=Math.max(0,jump-dt)}}$('step').onclick=()=>{paused=true;audio.setPaused(true);$('pause').textContent='继续';for(let i=0;i<6;i++){advance(1/60);vfx.update(1/60,{world})}};function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;if(!paused)advance(dt);const p=world.player;if(p)hero.position.set(p.x,Math.sin(jump/.45*Math.PI)*1.7,p.z);vfx.update(dt,{paused,world});for(let i=0;i<world.shots.length;i++){let mesh=shots[i];if(!mesh){mesh=new T.Mesh(shotGeo,shotMaterials[0]);scene.add(mesh);shots.push(mesh)}const s=world.shots[i];mesh.visible=true;mesh.position.set(s.x,1,s.z);mesh.quaternion.setFromUnitVectors(up,dir.set(s.dx,0,s.dz));mesh.material=shotMaterials[s.frost?1:s.knock?2:0]}for(let i=world.shots.length;i<shots.length;i++)shots[i].visible=false;const stats=vfx.getStats(),a=audio.getStatus();$('stats').textContent='技能时间 '+world.time.toFixed(2)+'s\n形状 '+stats.effects+'/'+stats.maxEffects+' · 粒子 '+stats.particles+'/'+stats.maxParticles+'\n光环 '+(stats.auras.join(', ')||'无')+'\n音效 '+(a.unlocked?'已解锁':'待点击')+' · '+a.activeVoices+'声 / '+a.cachedSounds+'已载入';renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
