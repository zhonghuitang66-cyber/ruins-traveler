<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>秋烬遗境 · 角色动作候选预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#c8b77f;color:#f8edcc;font:14px 'Microsoft YaHei',sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.panel{max-height:calc(100vh - 85px);overflow-y:auto;position:fixed;top:18px;left:18px;max-width:340px;background:#26392eea;padding:18px;border:1px solid #d7bb78;border-radius:8px}.panel h1{font-size:20px;margin:0 0 12px}.panel p{font-size:12px;line-height:1.6;color:#d5dfc9}.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button,select{background:#405743;color:#fff0c9;border:1px solid #b5b17b88;border-radius:4px;padding:8px;font:inherit;cursor:pointer}button.selected{background:#cfb67a;color:#273b2c}button:disabled{opacity:.4;cursor:default}#state{font-size:11px;line-height:1.6;white-space:pre-line;color:#ead69d}#actions{min-height:76px}a{color:#e7cf98}#warning{position:fixed;bottom:14px;left:18px;right:18px;text-align:center;background:#26392edb;padding:10px;font-size:12px;border-radius:4px}@media(max-height:480px){.panel{padding:10px;max-width:280px;top:8px;left:8px}.panel h1{font-size:16px}.panel p{font-size:10px;margin:6px 0}button,select{padding:5px;font-size:11px}.row{margin:6px 0}#warning{font-size:10px;padding:6px}}
</style></head><body><canvas id="preview"></canvas><div class="panel"><h1>角色动作候选预览</h1><div class="row"><select id="catalog"><option value="p2">P2重制候选</option><option value="legacy">旧H（已退回）</option></select></div><select id="role"><option value="paladin">圣骑士</option><option value="swordsman">剑士</option><option value="archer">弓箭手</option></select><p>此页展示制作中的模型与实际骨骼动作。缺失动作会禁用，专用技能及武器修整尚待验收。</p><div id="actions" class="row"></div><div class="row"><button id="pause">暂停</button><button id="front">正面</button><button id="back">背面</button><button id="angle">45°</button></div><div class="row"><label><input id="skeleton" type="checkbox"> 骨架</label><select id="speed"><option value="0.25">0.25倍慢放</option><option value="0.5">0.5倍慢放</option><option value="1" selected>原速</option></select><label><input id="timing" type="checkbox"> 游戏时序</label></div><label>源动作时间 <output id="playhead">0.00s</output><input id="scrub" type="range" min="0" max="1000" value="0" style="width:100%"></label><div id="state">正在读取候选清单…</div><p>拖动画面旋转 · <a href="index.html">返回游戏原型</a></p></div><div id="warning">候选预览不代表三职业全部动画或最终美术已完成</div><script type="module" src="src/character-preview.js"></script></body></html>
