<!doctype html><meta charset="utf-8"><title>Isolated local WebGL fixture</title>
<style>body{margin:0;background:#18242a;color:#fff;font:14px sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.label{position:fixed;width:48%;padding:10px;box-sizing:border-box;pointer-events:none;background:linear-gradient(#14252bd9,transparent);font-size:15px}#status{position:fixed;bottom:0;left:0;right:0;background:#14252bdd;font:12px monospace;padding:7px}#b{left:50%}#c{top:50%}#d{top:50%;left:50%}</style>
<canvas id="scene"></canvas><div class="label" id="a">隔离 WebGL fixture · 圣光护罩 / 真实球壳</div><div class="label" id="b">隔离 fixture · 爆裂地裂 / 朝向 +Z</div><div class="label" id="c">隔离 fixture · 回光返照 / 地面法阵</div><div class="label" id="d">隔离 fixture · 普攻横扫 / 俯视 +Z</div><div id="status">Loading local assets — fixture only, not MuMu</div>
<script type="module">
import * as T from './vendor/three.module.js';import {createSkillVFX} from './src/skill-vfx.js';import {createCharacterVisual} from './src/character-visual.js';import {toonifyCharacter} from './src/toon-render.js';
const errors=[];addEventListener('error',e=>errors.push(e.message));const renderer=new T.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.setScissorTest(true);
const catalog=await fetch('assets/models/player-runtime.json').then(r=>r.json()),cases=[{name:'guard',role:'paladin',camera:[4,3.5,5],target:[0,1,0],guard:5},{name:'fissure',role:'swordsman',camera:[7,10,-8],target:[0,.2,3],clip:'skill0',phase:.52},{name:'heal',role:'paladin',camera:[5,8,-7],target:[0,.3,0],healing:5},{name:'normal',role:'swordsman',camera:[0,12,-.01],target:[0,0,1],clip:'attack',phase:.72}];
for(const c of cases){const scene=new T.Scene();scene.background=new T.Color(0x66786a);scene.add(new T.HemisphereLight(0xffeed4,0x496052,2.2));const light=new T.DirectionalLight(0xfff3d9,2.6);light.position.set(-3,8,-4);scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(35,35),new T.MeshToonMaterial({color:0x71826a}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new T.GridHelper(30,30,0x3c5147,0x5e705f));scene.add(new T.ArrowHelper(new T.Vector3(0,0,1),new T.Vector3(0,.04,-1),4,0xffcc77,.4,.18));const vfx=createSkillVFX(scene),actor=createCharacterVisual({prepareModel:toonifyCharacter});scene.add(actor.root);await Promise.all([vfx.ready,actor.load({...catalog.roles[c.role],layered:true,anchorHips:true})]);const world={running:true,player:{x:0,z:0,hp:100},guard:c.guard||0,healing:c.healing||0,world:{walls:[]},shots:[]};if(c.clip==='attack')actor.playAttack({durationSeconds:catalog.roles[c.role].durations.attack});if(c.clip==='skill0')actor.playSkill({index:0,durationSeconds:catalog.roles[c.role].durations.skill0});const targetTime=c.clip?catalog.roles[c.role].durations[c.clip]*c.phase:0;for(let t=0;t<targetTime-1e-8;t+=1/120)actor.update(Math.min(1/120,targetTime-t));vfx.update(.01,{world});if(c.name==='fissure')vfx.emit('skill-impact',{role:'swordsman',index:0,x:0,z:0,dx:0,dz:1,length:9,width:2});if(c.name==='normal')vfx.emit('attack-impact',{role:'swordsman',x:0,z:0,dx:0,dz:1});if(c.name==='heal')vfx.emit('skill',{role:'paladin',index:2,x:0,z:0});for(let i=0;i<3;i++)vfx.update(.04,{world});const camera=new T.PerspectiveCamera(43,(innerWidth/2)/(innerHeight/2),.1,100);camera.position.fromArray(c.camera);camera.lookAt(...c.target);Object.assign(c,{scene,vfx,actor,camera});}
function render(){const w=Math.floor(innerWidth/2),h=Math.floor(innerHeight/2);for(let i=0;i<cases.length;i++){const c=cases[i],x=i%2*w,y=i<2?h:0;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.render(c.scene,c.camera)}}for(let i=0;i<5;i++){await new Promise(requestAnimationFrame);render()}document.getElementById('status').textContent='FIXTURE ONLY / not MuMu · local runtime GLB + production VFX modules · '+cases.map(c=>c.name+':'+c.vfx.getStats().effects).join(' | ')+' · errors '+errors.length;document.title='FIXTURE_READY';
</script>
